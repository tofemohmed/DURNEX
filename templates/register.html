    body {

```
    <h1>Create Account</h1>
    <p class="subtitle">Join the platform and track your cybersecurity learning journey.</p>

    <form action="/register" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="full_name">Full Name | الاسم الكامل</label>
        <input id="full_name" name="full_name" type="text"
               minlength="3" maxlength="100" autocomplete="name" required>

        <label for="username">Username</label>
        <input id="username" name="username" type="text"
               minlength="3" maxlength="50" autocomplete="username"
               required>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email"
               autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               minlength="12" autocomplete="new-password" required>

        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password"
               type="password" minlength="12"
               autocomplete="new-password" required>

        <button type="submit">Create My Account</button>
    </form>

    <div class="links">
        Already have an account? <a href="/login">Sign in</a>
    </div>

    <div class="arabic" lang="ar" dir="rtl">
        <strong>إنشاء حساب طالب</strong><br>
        أنشئ حسابك حتى تتمكن من متابعة مستواك التعليمي ونتائج اختباراتك.
        يجب أن تتكون كلمة المرور من 12 حرفاً على الأقل.
    </div>
</main>
