<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قائمة الطلاب</title>
</head>
<body>
    <h1>قائمة الطلاب</h1>
    <table border="1" cellpadding="8">
        <tr>
            <th>رقم الحساب</th>
            <th>اسم المستخدم</th>
            <th>الصلاحية</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user["id"] }}</td>
            <td>{{ user["username"] }}</td>
            <td>{{ user["role"] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
